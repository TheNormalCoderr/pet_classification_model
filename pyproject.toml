[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pet-face-classification"
version = "1.0.0"
description = "Pet breed classification using Oxford-IIIT Pet dataset with CNN and ResNet50 transfer learning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Amiteshwar Singh" }]
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.13,<3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["jupyter>=1.0"]

[project.scripts]
train-pet = "src.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
